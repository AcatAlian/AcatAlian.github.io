<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcatAlian | Portfolio</title>
    <style>
        body {
            background-color: #0f1115;
            color: #f1f3f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .portfolio-card {
            background-color: #1a1d24;
            border-left: 4px solid #00f2fe;
            border-radius: 8px;
            max-width: 500px;
            width: 100%;
            padding: 40px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 2.2rem;
            margin: 0 0 30px 0;
            letter-spacing: -0.5px;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        h2 {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a0aec0;
            margin: 0 0 20px 0;
        }
        .project-item {
            margin-bottom: 25px;
        }
        .project-item:last-child {
            margin-bottom: 0;
        }
        .project-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #ffffff;
            margin: 0 0 4px 0;
        }
        .project-role {
            font-size: 0.9rem;
            color: #00f2fe;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="portfolio-card">
    <h1>AcatAlian</h1>
    
    <h2>Projects & Experience</h2>
    
    <div class="project-item">
        <div class="project-title">Be an Anomaly or Guard</div>
        <div class="project-role">Tester, Moderator & Event Host</div>
    </div>

    <div class="project-item">
        <div class="project-title">Push Out!</div>
        <div class="project-role">Game Tester</div>
    </div>
</div>

</body>
</html>
