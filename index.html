<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AcatAlian | Portfolio</title>
<link rel="icon" id="faviconLink" href="avatar.png">
<meta name="description" content="AcatAlian's personal corner of the internet.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1115;
    --card-bg: #1a1d24;
    --card-bg-soft: #14161c;
    --text: #f1f3f5;
    --text-muted: #9aa3af;
    --accent: #00f2fe;
    --accent-2: #4facfe;
    --accent-glow: rgba(0, 242, 254, 0.35);
    --radius: 16px;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 60px 20px 40px;
    position: relative;
    overflow-x: hidden;
    cursor: url('Normal.cur'), auto;
  }

  /* ---------- ambient background (crossfading video slideshow) ---------- */
  .bg-slideshow {
    position: fixed;
    inset: 0;
    z-index: -3;
  }

  .bg-slide {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 1.4s ease;
  }

  .bg-slide.active {
    opacity: 1;
  }

  .bg-grid {
    position: fixed;
    inset: 0;
    z-index: -2;
    background-image:
      linear-gradient(rgba(0, 242, 254, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 242, 254, 0.06) 1px, transparent 1px);
    background-size: 42px 42px;
    -webkit-mask-image: radial-gradient(circle at center, black, transparent 75%);
    mask-image: radial-gradient(circle at center, black, transparent 75%);
  }

  .bg-glow {
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(circle at 15% 20%, rgba(0, 242, 254, 0.10), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(79, 172, 254, 0.10), transparent 40%);
  }

  .bg-particles {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
  }

  /* ---------- chasing LED border ---------- */
  .led-border {
    position: fixed;
    inset: 0;
    z-index: 999;
    pointer-events: none;
    padding: 3px;
    overflow: hidden;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude;
  }

  .led-border::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 200vmax;
    height: 200vmax;
    margin-top: -100vmax;
    margin-left: -100vmax;
    background: conic-gradient(from 0deg,
      transparent 0%,
      rgba(34, 197, 94, 0) 4%,
      rgba(34, 197, 94, 0.95) 12%,
      rgba(34, 197, 94, 0) 24%,
      transparent 100%);
    animation: ledChase 3.5s linear infinite;
    will-change: transform;
  }

  @keyframes ledChase {
    to { transform: rotate(360deg); }
  }

  /* ---------- audio control (top-left, like the reference) ---------- */
  .audio-control {
    position: fixed;
    top: 24px;
    left: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    z-index: 10;
  }

  .speaker-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--card-bg);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: url('Link.cur'), pointer;
    transition: color .2s, border-color .2s;
  }
  .speaker-btn:hover { color: var(--accent); border-color: var(--accent); }
  .speaker-btn svg { width: 16px; height: 16px; }

  .volume-slider {
    writing-mode: vertical-lr;
    direction: rtl;
    width: 4px;
    height: 90px;
    accent-color: var(--accent);
    background: transparent;
    cursor: url('Link.cur'), pointer;
  }

  .audio-hint {
    position: absolute;
    top: 8px;
    left: 48px;
    font-size: 0.72rem;
    color: var(--text-muted);
    background: var(--card-bg);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 5px 12px;
    border-radius: 20px;
    white-space: nowrap;
    animation: hintPulse 1.6s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes hintPulse {
    0%, 100% { opacity: 0.45; }
    50% { opacity: 1; }
  }

  /* ---------- like button (top-right, mirrors audio-control) ---------- */
  .like-control {
    position: fixed;
    top: 24px;
    right: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    z-index: 10;
  }

  .like-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--card-bg);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: url('Link.cur'), pointer;
    transition: color .2s, border-color .2s, transform .15s;
  }
  .like-btn svg { width: 17px; height: 17px; }
  .like-btn:hover { color: #f23f43; border-color: #f23f43; }
  .like-btn.liked { color: #f23f43; border-color: #f23f43; animation: likePop .35s ease; }
  .like-btn.liked svg { fill: #f23f43; }
  .like-btn:disabled { cursor: url('Normal.cur'), default; }

  @keyframes likePop {
    0% { transform: scale(1); }
    45% { transform: scale(1.3); }
    100% { transform: scale(1); }
  }

  .like-count {
    color: var(--text-muted);
    font-size: 0.72rem;
    letter-spacing: 0.02em;
  }

  /* ---------- cursor trail ---------- */
  .cursor-trail-dot {
    position: fixed;
    top: 0;
    left: 0;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent-glow);
    pointer-events: none;
    z-index: 997;
    transform: translate(-50%, -50%) scale(1);
    opacity: 0.75;
    transition: opacity .5s ease, transform .5s ease;
    will-change: transform, opacity;
  }

  /* ---------- card ---------- */
  .card {
    position: relative;
    width: 100%;
    max-width: 440px;
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.04);
    padding-top: 62px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .avatar-wrap {
    position: absolute;
    top: -54px;
    left: 50%;
    transform: translateX(-50%);
    width: 108px;
    height: 108px;
    border-radius: 50%;
    padding: 4px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    animation: avatarPulse 3s ease-in-out infinite;
  }

  @keyframes avatarPulse {
    0%, 100% { box-shadow: 0 0 18px var(--accent-glow); }
    50% { box-shadow: 0 0 30px var(--accent-glow); }
  }

  .avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    background: var(--card-bg-soft);
  }

  /* ---------- avatar status badge (own design, not a Discord copy) ---------- */
  .avatar-status {
    position: absolute;
    bottom: 1px;
    right: 1px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--card-bg);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .avatar-status::after {
    content: "";
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: #80848e;
    transition: background .3s, box-shadow .3s;
  }

  .avatar-status.online::after  { background: #23a55a; box-shadow: 0 0 7px #23a55a; }
  .avatar-status.idle::after    { background: #f0b232; box-shadow: 0 0 7px #f0b232; }
  .avatar-status.dnd::after     { background: #f23f43; box-shadow: 0 0 7px #f23f43; }
  .avatar-status.offline::after { background: #80848e; }

  .view-counter {
    display: flex;
    align-items: center;
    gap: 5px;
    color: var(--text-muted);
    font-size: 0.72rem;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  .view-counter svg {
    width: 13px;
    height: 13px;
    flex-shrink: 0;
  }

  /* ---------- discord live status (Lanyard) ---------- */
  .discord-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    color: var(--text-muted);
    margin: 0 0 12px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #80848e;
    flex-shrink: 0;
  }
  .status-dot.online  { background: #23a55a; box-shadow: 0 0 6px #23a55a; }
  .status-dot.idle    { background: #f0b232; box-shadow: 0 0 6px #f0b232; }
  .status-dot.dnd     { background: #f23f43; box-shadow: 0 0 6px #f23f43; }
  .status-dot.offline { background: #80848e; }

  .spotify-status {
    display: none;
    align-items: center;
    gap: 10px;
    background: var(--card-bg-soft);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 10px;
    padding: 8px 10px;
    margin: 0 0 18px;
  }

  .spotify-status img {
    width: 36px;
    height: 36px;
    border-radius: 6px;
    object-fit: cover;
    flex-shrink: 0;
  }

  .spotify-info {
    display: flex;
    flex-direction: column;
    min-width: 0;
    font-size: 0.78rem;
  }
  .spotify-info span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spotify-info .spotify-song { color: var(--text); font-weight: 600; }
  .spotify-info .spotify-artist { color: var(--text-muted); }

  /* ---------- discord activity status (games/apps, via Lanyard) ---------- */
  .activity-status {
    display: none;
    align-items: center;
    gap: 10px;
    background: var(--card-bg-soft);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 10px;
    padding: 8px 10px;
    margin: 0 0 18px;
  }

  .activity-status img {
    width: 36px;
    height: 36px;
    border-radius: 6px;
    object-fit: cover;
    flex-shrink: 0;
    background: var(--card-bg);
  }

  .activity-info {
    display: flex;
    flex-direction: column;
    min-width: 0;
    font-size: 0.78rem;
  }
  .activity-info span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .activity-info .activity-name { color: var(--text); font-weight: 600; }
  .activity-info .activity-detail { color: var(--text-muted); }

  /* ---------- copy chips (Discord tag / Roblox username) ---------- */
  .id-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 0 0 16px;
  }

  .copy-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--card-bg-soft);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: var(--text-muted);
    font-family: inherit;
    font-size: 0.75rem;
    padding: 6px 10px;
    border-radius: 20px;
    cursor: url('Link.cur'), pointer;
    transition: border-color .2s, color .2s, box-shadow .2s;
  }
  .copy-chip:hover {
    color: var(--text);
    border-color: var(--accent);
    box-shadow: 0 0 12px var(--accent-glow);
  }
  .copy-chip kbd {
    font-family: inherit;
    font-weight: 600;
    color: var(--text);
  }

  /* ---------- discord server counts (near icon row) ---------- */
  .card-footer {
    width: calc(100% - 56px);
    margin: 18px 0 24px;
    padding-top: 18px;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  /* ---------- custom right-click menu ---------- */
  .ctx-menu {
    position: fixed;
    z-index: 1001;
    min-width: 198px;
    background: var(--card-bg);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55), 0 0 18px var(--accent-glow);
    padding: 6px;
    display: none;
  }
  .ctx-menu.open { display: block; }
  .ctx-menu button {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: 0;
    color: var(--text);
    font-family: inherit;
    font-size: 0.82rem;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: url('Link.cur'), pointer;
  }
  .ctx-menu button:hover {
    background: var(--card-bg-soft);
    color: var(--accent);
  }
  .ctx-menu hr {
    border: 0;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    margin: 4px 6px;
  }

  /* ---------- audio visualizer ---------- */
  .visualizer {
    display: block;
    width: 130px;
    height: 24px;
    margin: 6px auto 0;
  }

  .now-playing {
    margin: 2px 0 0;
    font-size: 0.68rem;
    color: var(--text-muted);
    text-align: center;
    max-width: 260px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    opacity: 0;
    transition: opacity .3s;
  }
  .now-playing.visible { opacity: 1; }

  /* ---------- konami easter egg ---------- */
  .egg-toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translate(-50%, -20px);
    background: var(--card-bg);
    border: 1px solid var(--accent);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 30px;
    font-size: 0.85rem;
    font-weight: 600;
    box-shadow: 0 0 20px var(--accent-glow);
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s, transform .3s;
    z-index: 1000;
    white-space: nowrap;
  }
  .egg-toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  .confetti-piece {
    position: fixed;
    top: -10px;
    width: 8px;
    height: 8px;
    z-index: 998;
    pointer-events: none;
    border-radius: 2px;
    animation: confettiFall linear forwards;
  }

  @keyframes confettiFall {
    to { transform: translateY(110vh) rotate(360deg); }
  }

  .card-body {
    width: 100%;
    padding: 22px 28px 6px;
  }

  .card-scroll {
    max-height: 340px;
    overflow-y: auto;
    padding-right: 8px;
  }

  .card-scroll::-webkit-scrollbar { width: 6px; }
  .card-scroll::-webkit-scrollbar-track { background: transparent; }
  .card-scroll::-webkit-scrollbar-thumb { background: rgba(0, 242, 254, 0.35); border-radius: 10px; }

  .name {
    font-family: var(--font-display);
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 4px;
    background: linear-gradient(90deg,
      #17c964 0%,
      #00f2fe 25%,
      #4facfe 50%,
      #eafff3 62%,
      #17c964 78%,
      #00f2fe 100%);
    background-size: 280% 100%;
    background-position: 0% 50%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 12px var(--accent-glow));
    animation: nameShine 4.5s linear infinite;
  }

  @keyframes nameShine {
    to { background-position: 100% 50%; }
  }

  .aliases {
    margin: 0 0 16px;
    font-size: 0.85rem;
    color: var(--text-muted);
    letter-spacing: 0.02em;
  }

  .alias-word {
    text-transform: uppercase;
  }
  .alias-word:hover {
    text-transform: none;
    color: var(--accent);
  }

  .intro {
    margin: 0 0 22px;
    line-height: 1.6;
    font-size: 0.95rem;
  }

  .section-title {
    font-family: var(--font-display);
    font-size: 0.85rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--accent);
    margin: 4px 0 10px;
  }

  .about-text {
    line-height: 1.7;
    font-size: 0.92rem;
    color: var(--text-muted);
    margin: 0;
  }

  /* ---------- local time (bottom-left, mirrors audio-control) ---------- */
  .local-time {
    position: fixed;
    bottom: 24px;
    left: 24px;
    display: flex;
    align-items: center;
    gap: 5px;
    color: var(--text-muted);
    font-size: 0.72rem;
    letter-spacing: 0.02em;
    white-space: nowrap;
    z-index: 10;
  }

  .local-time svg {
    width: 13px;
    height: 13px;
    flex-shrink: 0;
  }

  .local-time-zone {
    opacity: 0.7;
  }

  /* ---------- icon links ---------- */
  .icon-row {
    display: flex;
    justify-content: center;
    gap: 14px;
    width: 100%;
  }

  .icon-btn {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: var(--card-bg-soft);
    border: 1px solid rgba(255, 255, 255, 0.1);
    cursor: url('Link.cur'), pointer;
    transition: border-color .2s, box-shadow .2s, transform .2s;
  }

  .icon-btn img {
    width: 60%;
    height: 60%;
    object-fit: contain;
    display: block;
    /* logos are solid black — invert so they show up as light shapes
       against the dark circle instead of disappearing into it */
    filter: invert(1) brightness(1.15);
  }

  .icon-btn img.icon-discord {
    width: 50%;
    height: 50%;
  }

  .icon-btn:hover {
    border-color: rgba(34, 197, 94, 0.6);
    box-shadow: 0 0 14px rgba(34, 197, 94, 0.35);
    transform: translateY(-3px);
  }

  button:focus-visible, a:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  @media (max-width: 480px) {
    .card-body { padding: 22px 20px 6px; }
    .card-footer { width: calc(100% - 40px); }
    .name { font-size: 1.6rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

  <!-- CUSTOMIZE: list your mp4 clips here — add or remove <video class="bg-slide"> blocks freely, the script adapts automatically -->
  <div class="bg-slideshow" id="bgSlideshow">
    <video class="bg-slide active" autoplay muted loop playsinline><source src="background1.mp4" type="video/mp4"></video>
    <video class="bg-slide" autoplay muted loop playsinline><source src="background2.mp4" type="video/mp4"></video>
    <video class="bg-slide" autoplay muted loop playsinline><source src="background3.mp4" type="video/mp4"></video>
    <video class="bg-slide" autoplay muted loop playsinline><source src="background4.mp4" type="video/mp4"></video>
    <video class="bg-slide" autoplay muted loop playsinline><source src="background5.mp4" type="video/mp4"></video>
  </div>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>
  <canvas class="bg-particles" id="bgParticles"></canvas>
  <div class="led-border"></div>
  <div class="egg-toast" id="siteToast">🥚 secret found!</div>

  <div class="local-time" id="localTime" title="My local time">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
    <span id="localTimeText">--:--</span>
    <!-- CUSTOMIZE: swap this label if you change the TIMEZONE constant in the script -->
    <span class="local-time-zone">· Malaysia (GMT+8)</span>
  </div>

  <!-- CUSTOMIZE: point this at your own track, or delete the whole .audio-control block and <audio> tag if you don't want music -->
  <div class="audio-control">
    <button class="speaker-btn" id="muteBtn" aria-label="Toggle sound">
      <svg id="speakerIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
    </button>
    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="60" orient="vertical" aria-label="Volume">
    <div class="view-counter" title="Unique views">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      <span id="viewCount">···</span>
    </div>
    <span class="audio-hint" id="audioHint">tap for sound</span>
  </div>
  <audio id="bgAudio" loop>
    <source src="song.mp3" type="audio/mpeg">
  </audio>

  <div class="like-control">
    <button class="like-btn" id="likeBtn" aria-label="Like this page" aria-pressed="false">

    <button type="button" data-action="copy-link">Copy page link</button>

  <script>
    // --- audio control ---
    const audio = document.getElementById('bgAudio');
    const muteBtn = document.getElementById('muteBtn');
    const speakerIcon = document.getElementById('speakerIcon');
    const volumeSlider = document.getElementById('volumeSlider');
    const audioHint = document.getElementById('audioHint');
    const hideHint = () => { if (audioHint) audioHint.style.display = 'none'; };
    const iconOn = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.5 8.5a5 5 0 0 1 0 7"></path>';
    const iconOff = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line>';

    audio.volume = volumeSlider.value / 100;

    // Shared identity used by copy chips, the context menu, and live status cards.
    // CUSTOMIZE: keep these in sync with your Discord / Roblox accounts.
    const PROFILE = {
      discordTag: 'fizi.acat',
      robloxUser: 'Mybusises',
      robloxId: 1824718468,
      discordUrl: 'https://discord.gg/Cjc5QGhbFu',
      robloxUrl: 'https://www.roblox.com/users/1824718468/profile'
    };

    function showToast(message) {
      const toast = document.getElementById('siteToast');
      if (!toast) return;
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    function copyText(text, okMessage) {
      const done = () => showToast(okMessage || 'Copied!');
      const value = String(text || '');
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(value).then(done).catch(() => fallbackCopy(value, done));
      } else {
        fallbackCopy(value, done);
      }
    }

    function fallbackCopy(text, done) {
      const area = document.createElement('textarea');
      area.value = text;
      area.setAttribute('readonly', '');
      area.style.position = 'fixed';
      area.style.left = '-9999px';
      document.body.appendChild(area);
      area.select();
      try { document.execCommand('copy'); done(); }
      catch (err) { showToast('Copy failed'); }
      area.remove();
    }

    // Try real autoplay with sound first. Browsers allow this for some
    // visitors (repeat visits, granted permissions, etc). If it's blocked,
    // fall back to muted + wait for a click, instead of assuming it'll fail.
    audio.play().then(() => {
      audio.muted = false;
      speakerIcon.innerHTML = iconOn;
      hideHint();
    }).catch(() => {
      audio.muted = true;
      speakerIcon.innerHTML = iconOff;
      // Fallback: unlock audio on the very first click anywhere on the
      // page — not just the speaker button — since any real click counts
      // as a valid user gesture to browsers.
      document.addEventListener('click', unlockAudio, { once: true });
    });

    function unlockAudio() {
      hideHint();
      if (audio.muted) {
        audio.muted = false;
        speakerIcon.innerHTML = iconOn;
        audio.play().catch(() => {});
      }
    }

    muteBtn.addEventListener('click', () => {
      hideHint();
      audio.muted = !audio.muted;
      speakerIcon.innerHTML = audio.muted ? iconOff : iconOn;
      if (!audio.muted) {
        audio.play().catch(() => { /* no audio file added yet — ignore */ });
      }
    });

    volumeSlider.addEventListener('input', () => {
      hideHint();
      audio.volume = volumeSlider.value / 100;
      if (audio.volume === 0) {
        audio.muted = true;
        speakerIcon.innerHTML = iconOff;
      } else if (audio.muted) {
        audio.muted = false;
        speakerIcon.innerHTML = iconOn;
        audio.play().catch(() => {});
      }
    });

    // --- unique view counter ---
    // Uses Abacus (abacus.jasoncameron.dev), a free counting API that needs
    // no signup or API key. "Unique" here means once per browser: a flag is
    // stored in localStorage so a repeat visit in the same browser reads the
    // current count instead of bumping it. Clearing site data, a different
    // browser, or an incognito window will count as a new view again —
    // nothing running client-side can truly tell "the same person" apart
    // without requiring an account.
    (function () {
      const countEl = document.getElementById('viewCount');
      if (!countEl) return;

      // CUSTOMIZE: pick a namespace unique to your site (e.g. your domain)
      // so your counter can't collide with someone else's.
      const NAMESPACE = 'acatalian-portfolio';
      const KEY = 'views';
      const STORAGE_FLAG = 'acatalian_view_counted';

      const alreadyCounted = localStorage.getItem(STORAGE_FLAG);
      const endpoint = alreadyCounted
        ? `https://abacus.jasoncameron.dev/get/${NAMESPACE}/${KEY}`
        : `https://abacus.jasoncameron.dev/hit/${NAMESPACE}/${KEY}`;

      fetch(endpoint)
        .then(res => res.json())
        .then(data => {
          countEl.textContent = Number(data.value).toLocaleString();
          if (!alreadyCounted) localStorage.setItem(STORAGE_FLAG, '1');
        })
        .catch(() => {
          countEl.textContent = '—';
        });
    })();

    // --- discord live status (Lanyard) ---
    // Free, no signup: Lanyard tracks presence for any Discord user who has
    // joined its server once. CUSTOMIZE: set your Discord user ID below,
    // then join https://discord.gg/lanyard one time (you can leave right
    // after — it just needs to see your account once to start tracking).
    (function () {
      const DISCORD_ID = '1290227925072871435';
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      const avatarStatus = document.getElementById('avatarStatus');
      const spotifyBox = document.getElementById('spotifyStatus');
      const spotifyArt = document.getElementById('spotifyArt');
      const spotifySong = document.getElementById('spotifySong');
      const spotifyArtist = document.getElementById('spotifyArtist');
      const activityBox = document.getElementById('activityStatus');
      const activityArt = document.getElementById('activityArt');
      const activityName = document.getElementById('activityName');
      const activityDetail = document.getElementById('activityDetail');
      if (!statusDot) return;

      if (DISCORD_ID === 'YOUR_DISCORD_ID') {
        statusText.textContent = 'Add your Discord ID to enable this';
        return;
      }

      const labels = { online: 'Online', idle: 'Idle', dnd: 'Do Not Disturb', offline: 'Offline' };

      // Discord Rich Presence activity "type" values: 0 Playing, 1 Streaming,
      // 2 Listening (Spotify — already handled by the dedicated box above),
      // 3 Watching, 4 Custom Status (plain text/emoji, skipped here), 5 Competing.
      const ACTIVITY_VERBS = { 0: 'Playing', 1: 'Streaming', 3: 'Watching', 5: 'Competing in' };

      // Rich Presence images come in a couple of shapes depending on source —
      // a raw Discord app-asset hash, or an "mp:"/"spotify:" prefixed key for
      // externally hosted art. This normalizes any of them into a real URL.
      function activityImageUrl(activity) {
        const img = activity.assets && activity.assets.large_image;
        if (!img) return null;
        if (img.startsWith('mp:')) return `https://media.discordapp.net/${img.slice(3)}`;
        if (img.startsWith('spotify:')) return `https://i.scdn.co/image/${img.slice(8)}`;
        return `https://cdn.discordapp.com/app-assets/${activity.application_id}/${img}.png`;
      }

      function render(data) {
        const status = data.discord_status || 'offline';
        statusDot.className = 'status-dot ' + status;
        statusText.textContent = labels[status] || 'Offline';
        if (avatarStatus) avatarStatus.className = 'avatar-status ' + status;
        if (window.setFaviconStatus) window.setFaviconStatus(status);

        const user = data.discord_user;
        if (user && user.username) {
          PROFILE.discordTag = user.username;
          const tagEl = document.getElementById('discordTag');
          if (tagEl) tagEl.textContent = user.username;
        }

        if (data.listening_to_spotify && data.spotify) {
          spotifyArt.src = data.spotify.album_art_url;
          spotifySong.textContent = data.spotify.song;
          spotifyArtist.textContent = data.spotify.artist;
          spotifyBox.style.display = 'flex';
        } else {
          spotifyBox.style.display = 'none';
        }

        // Full activity status: games and apps, not just Spotify.
        const activity = (data.activities || []).find(a => ACTIVITY_VERBS[a.type] !== undefined);
        if (activity && activityBox) {
          activityName.textContent = `${ACTIVITY_VERBS[activity.type]} ${activity.name}`;
          activityDetail.textContent = activity.details || activity.state || '';

          const imgUrl = activityImageUrl(activity);
          activityArt.style.display = imgUrl ? 'block' : 'none';
          if (imgUrl) activityArt.src = imgUrl;

          activityBox.style.display = 'flex';
        } else if (activityBox) {
          activityBox.style.display = 'none';
        }
      }

      function poll() {
        fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`)
          .then(res => res.json())
          .then(json => {
            if (json.success) {
              render(json.data);
            } else {
              statusText.textContent = 'Join the Lanyard server to enable this';
            }
          })
          .catch(() => { statusText.textContent = 'Status unavailable'; });
      }

      poll();
      setInterval(poll, 20000); // refresh every 20s — simple polling, no websocket needed
    })();

    // --- audio-reactive visualizer bars ---
    // Taps the existing background-music element via the Web Audio API.
    // Needs a user gesture to start (browser rule), so it hooks into the
    // same first click that already unlocks audio playback above.
    (function () {
      const canvas = document.getElementById('visualizer');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let audioCtx, analyser, dataArray, started = false;

      function resize() {
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      // Only the lower end of the spectrum carries real energy for most
      // music — rendering the full frequency range left a cluster of live
      // bars followed by a long stretch of near-silent ones. Using fewer,
      // wider bars over just that active range keeps it compact instead.
      const BAR_COUNT = 10;

      function draw() {
        requestAnimationFrame(draw);
        if (!analyser) return;
        analyser.getByteFrequencyData(dataArray);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const barWidth = canvas.width / BAR_COUNT;
        const grad = ctx.createLinearGradient(0, canvas.height, 0, 0);
        grad.addColorStop(0, '#4facfe');
        grad.addColorStop(1, '#00f2fe');
        ctx.fillStyle = grad;
        for (let i = 0; i < BAR_COUNT; i++) {
          const v = dataArray[i] / 255;
          const barHeight = Math.max(2, v * canvas.height);
          ctx.fillRect(i * barWidth + 1, canvas.height - barHeight, barWidth - 2, barHeight);
        }
      }

      function setup() {
        if (started) return;
        started = true;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaElementSource(audio);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 32;
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        draw();
      }

      document.addEventListener('click', () => {
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        setup();
      });
    })();

    // --- konami code easter egg ---
    (function () {
      const code = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
      let progress = 0;
      const colors = ['#00f2fe', '#4facfe', '#17c964', '#eafff3'];

      function confettiBurst() {
        for (let i = 0; i < 60; i++) {
          const piece = document.createElement('div');
          piece.className = 'confetti-piece';
          piece.style.left = Math.random() * 100 + 'vw';
          piece.style.background = colors[Math.floor(Math.random() * colors.length)];
          piece.style.animationDuration = (2 + Math.random() * 1.5) + 's';
          piece.style.opacity = 0.7 + Math.random() * 0.3;
          document.body.appendChild(piece);
          piece.addEventListener('animationend', () => piece.remove());
        }
      }

      function trigger() {
        confettiBurst();
        showToast('🥚 secret found!');
      }

      window.addEventListener('keydown', (e) => {
        const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
        progress = (key === code[progress]) ? progress + 1 : (key === code[0] ? 1 : 0);
        if (progress === code.length) {
          progress = 0;
          trigger();
        }
      });
    })();

    // --- local time (your own timezone, not the visitor's) ---
    (function () {
      const el = document.getElementById('localTimeText');
      if (!el) return;

      // CUSTOMIZE: set this to your own IANA timezone name.
      // Full list: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
      const TIMEZONE = 'Asia/Kuala_Lumpur';

      const formatter = new Intl.DateTimeFormat('en-US', {
        timeZone: TIMEZONE,
        hour: 'numeric',
        minute: '2-digit',
        hour12: true
      });

      function update() {
        el.textContent = formatter.format(new Date());
      }

      update();
      setInterval(update, 30000); // a clock this coarse doesn't need per-second ticks
    })();

    // --- cursor trail effect ---
    // Spawns small glowing dots that follow the pointer and fade out. Skips
    // itself on touch devices (no real cursor to trail) and when the visitor
    // has asked for reduced motion.
    (function () {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      if (window.matchMedia('(pointer: coarse)').matches) return;

      let lastSpawn = 0;
      const MIN_GAP = 30; // ms between dots — keeps it a trail, not a smear

      window.addEventListener('pointermove', (e) => {
        const now = performance.now();
        if (now - lastSpawn < MIN_GAP) return;
        lastSpawn = now;

        const dot = document.createElement('div');
        dot.className = 'cursor-trail-dot';
        dot.style.left = e.clientX + 'px';
        dot.style.top = e.clientY + 'px';
        document.body.appendChild(dot);

        // Let it paint at full opacity for a frame, then transition out —
        // starting the transition immediately on append can get skipped.
        requestAnimationFrame(() => {
          dot.style.opacity = '0';
          dot.style.transform = 'translate(-50%, -50%) scale(0.2)';
        });

        setTimeout(() => dot.remove(), 550);
      });
    })();

    // --- like button (heart counter) ---
    // Same Abacus service as the view counter above, but user-triggered: a
    // click adds one like (a single /hit/ call) and is remembered in
    // localStorage so the heart shows as already-liked on repeat visits in
    // the same browser. There's no "unlike" — Abacus doesn't expose a
    // decrement endpoint, so once liked the button just stays filled.
    (function () {
      const likeBtn = document.getElementById('likeBtn');
      const likeCountEl = document.getElementById('likeCount');
      if (!likeBtn) return;

      const NAMESPACE = 'acatalian-portfolio';
      const KEY = 'likes';
      const STORAGE_FLAG = 'acatalian_liked';

      function setLiked() {
        likeBtn.classList.add('liked');
        likeBtn.setAttribute('aria-pressed', 'true');
        likeBtn.disabled = true;
      }

      if (localStorage.getItem(STORAGE_FLAG)) setLiked();

      fetch(`https://abacus.jasoncameron.dev/get/${NAMESPACE}/${KEY}`)
        .then(res => res.json())
        .then(data => { likeCountEl.textContent = Number(data.value).toLocaleString(); })
        .catch(() => { likeCountEl.textContent = '—'; });

      likeBtn.addEventListener('click', () => {
        if (localStorage.getItem(STORAGE_FLAG)) return; // one like per browser

        setLiked();
        localStorage.setItem(STORAGE_FLAG, '1');

        fetch(`https://abacus.jasoncameron.dev/hit/${NAMESPACE}/${KEY}`)
          .then(res => res.json())
          .then(data => { likeCountEl.textContent = Number(data.value).toLocaleString(); })
          .catch(() => { /* count will resync next time the page loads */ });
      });
    })();

    // --- copy Discord tag / Roblox username ---
    (function () {
      const discordBtn = document.getElementById('copyDiscord');
      const robloxBtn = document.getElementById('copyRoblox');
      if (discordBtn) {
        discordBtn.addEventListener('click', () => copyText(PROFILE.discordTag, 'Copied!'));
      }
      if (robloxBtn) {
        robloxBtn.addEventListener('click', () => copyText(PROFILE.robloxUser, 'Copied!'));
      }
    })();

    // --- live Roblox status (presence.roblox.com via RoProxy for CORS) ---
    // Presence is public and needs no cookie. Place/game names only show when
    // the account's privacy settings allow them; otherwise we still show
    // Online / Playing / Studio from userPresenceType.
    (function () {
      const box = document.getElementById('robloxStatus');
      const art = document.getElementById('robloxArt');
      const nameEl = document.getElementById('robloxName');
      const detailEl = document.getElementById('robloxDetail');
      const userEl = document.getElementById('robloxUser');
      if (!box) return;

      const TYPES = { 0: 'Offline', 1: 'Online', 2: 'InGame', 3: 'InStudio', 4: 'Invisible' };

      function setHeadshot() {
        fetch(`https://thumbnails.roproxy.com/v1/users/avatar-headshot?userIds=${PROFILE.robloxId}&size=48x48&format=Png`)
          .then(res => res.json())
          .then(json => {
            const url = json.data && json.data[0] && json.data[0].imageUrl;
            if (url) {
              art.src = url;
              art.style.display = 'block';
            }
          })
          .catch(() => { art.style.display = 'none'; });
      }

      function setPlaceIcon(placeId) {
        fetch(`https://thumbnails.roproxy.com/v1/places/gameicons?placeIds=${placeId}&size=50x50&format=Png`)
          .then(res => res.json())
          .then(json => {
            const url = json.data && json.data[0] && json.data[0].imageUrl;
            if (url) {
              art.src = url;
              art.style.display = 'block';
            }
          })
          .catch(() => {});
      }

      function hide() {
        box.style.display = 'none';
      }

      function renderPresence(p) {
        const type = p.userPresenceType;
        if (type === 0 || type === 4 || TYPES[type] === undefined) {
          hide();
          return;
        }

        if (type === 1) {
          nameEl.textContent = 'Online on Roblox';
          detailEl.textContent = p.lastLocation && p.lastLocation !== 'Website' ? p.lastLocation : 'Browsing';
          setHeadshot();
        } else if (type === 2) {
          const place = p.lastLocation && p.lastLocation !== 'Website' ? p.lastLocation : 'a game';
          nameEl.textContent = 'Playing ' + place;
          detailEl.textContent = 'Roblox';
          if (p.placeId) setPlaceIcon(p.placeId);
          else setHeadshot();
        } else if (type === 3) {
          nameEl.textContent = 'In Roblox Studio';
          detailEl.textContent = p.lastLocation || 'Creating';
          setHeadshot();
        }

        box.style.display = 'flex';
      }

      fetch(`https://users.roproxy.com/v1/users/${PROFILE.robloxId}`)
        .then(res => res.json())
        .then(user => {
          if (user && user.name) {
            PROFILE.robloxUser = user.name;
            if (userEl) userEl.textContent = user.name;
          }
        })
        .catch(() => {});

      function poll() {
        fetch('https://presence.roproxy.com/v1/presence/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userIds: [PROFILE.robloxId] })
        })
          .then(res => res.json())
          .then(json => {
            const p = json.userPresences && json.userPresences[0];
            if (p) renderPresence(p);
            else hide();
          })
          .catch(() => hide());
      }

      poll();
      setInterval(poll, 20000);
    })();

    // --- custom right-click menu ---
    (function () {
      const menu = document.getElementById('ctxMenu');
      if (!menu) return;

      function hide() {
        menu.classList.remove('open');
      }

      function place(x, y) {
        menu.classList.add('open');
        const pad = 8;
        const w = menu.offsetWidth;
        const h = menu.offsetHeight;
        const left = Math.min(x, window.innerWidth - w - pad);
        const top = Math.min(y, window.innerHeight - h - pad);
        menu.style.left = Math.max(pad, left) + 'px';
        menu.style.top = Math.max(pad, top) + 'px';
      }

      window.addEventListener('contextmenu', (e) => {
        if (e.target.closest('input, textarea, audio')) return;
        e.preventDefault();
        place(e.clientX, e.clientY);
      });

      window.addEventListener('click', hide);
      window.addEventListener('scroll', hide, true);
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') hide();
      });

      menu.addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;
        e.stopPropagation();
        const action = btn.getAttribute('data-action');
        hide();
        if (action === 'copy-link') copyText(location.href, 'Copied!');
        if (action === 'copy-discord') copyText(PROFILE.discordTag, 'Copied!');
        if (action === 'copy-roblox') copyText(PROFILE.robloxUser, 'Copied!');
        if (action === 'open-discord') window.open(PROFILE.discordUrl, '_blank', 'noopener');
        if (action === 'open-roblox') window.open(PROFILE.robloxUrl, '_blank', 'noopener');
        if (action === 'view-source') {
          const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
          const blob = new Blob([html], { type: 'text/html' });
          window.open(URL.createObjectURL(blob), '_blank', 'noopener');
        }
      });
    })();

    // --- now playing label (visualizer) ---
    // Purely local — it's your own single background track, not a live feed,
    // so it just shows/hides with actual playback rather than polling anything.
    (function () {
      const el = document.getElementById('nowPlaying');
      if (!el) return;
      function sync() { el.classList.toggle('visible', !audio.paused); }
      audio.addEventListener('play', sync);
      audio.addEventListener('pause', sync);
      sync();
    })();

    // --- dynamic favicon status dot ---
    // Draws your avatar onto an offscreen canvas with a small colored dot in
    // the corner (same colors as the on-page status indicator) and sets it
    // as the tab's favicon. Called from the Lanyard render() above whenever
    // your status changes, so the browser tab stays in sync even when the
    // page itself isn't the one being looked at.
    (function () {
      const SIZE = 64;
      const canvas = document.createElement('canvas');
      canvas.width = SIZE;
      canvas.height = SIZE;
      const ctx = canvas.getContext('2d');
      const img = new Image();
      let loaded = false;
      let pending = 'offline';

      const STATUS_COLORS = { online: '#23a55a', idle: '#f0b232', dnd: '#f23f43', offline: '#80848e' };

      let link = document.getElementById('faviconLink');
      if (!link) {
        link = document.createElement('link');
        link.rel = 'icon';
        link.id = 'faviconLink';
        document.head.appendChild(link);
      }

      function draw(status) {
        if (!loaded) { pending = status; return; }
        ctx.clearRect(0, 0, SIZE, SIZE);

        ctx.save();
        ctx.beginPath();
        ctx.arc(SIZE / 2, SIZE / 2, SIZE / 2, 0, Math.PI * 2);
        ctx.closePath();
        ctx.clip();
        ctx.drawImage(img, 0, 0, SIZE, SIZE);
        ctx.restore();

        const r = SIZE * 0.17;
        const cx = SIZE - r - 2;
        const cy = SIZE - r - 2;
        ctx.beginPath();
        ctx.arc(cx, cy, r + 3, 0, Math.PI * 2);
        ctx.fillStyle = '#0f1115'; // matches --bg, so the dot reads clearly against any avatar
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fillStyle = STATUS_COLORS[status] || STATUS_COLORS.offline;
        ctx.fill();

        try { link.href = canvas.toDataURL('image/png'); } catch (err) { /* ignore */ }
      }

      img.onload = () => { loaded = true; draw(pending); };
      img.onerror = () => { /* keep the static favicon if the avatar fails to load */ };
      img.src = 'avatar.png';

      window.setFaviconStatus = draw;
    })();

    // --- background video crossfade slideshow ---
    // Holds each clip fully visible for HOLD_MS, then crossfades to the
    // next. All clips stay in the DOM the whole time (just at opacity 0)
    // rather than being swapped in/out, so playback keeps looping
    // continuously instead of restarting from frame one every cycle.
    (function () {
      const slides = document.querySelectorAll('.bg-slide');
      if (slides.length < 2) return;
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      const HOLD_MS = 4000; // how long each gif is shown before crossfading
      let index = 0;

      setInterval(() => {
        slides[index].classList.remove('active');
        index = (index + 1) % slides.length;
        slides[index].classList.add('active');
      }, HOLD_MS);
    })();

    // --- ambient background particles ---
    (function () {
      const canvas = document.getElementById('bgParticles');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const COLORS = ['#00f2fe', '#4facfe', '#17c964'];
      let particles = [];

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      function spawn() {
        const count = Math.min(60, Math.floor((canvas.width * canvas.height) / 22000));
        particles = Array.from({ length: count }, () => ({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: 1 + Math.random() * 1.8,
          vx: (Math.random() - 0.5) * 0.15,
          vy: (Math.random() - 0.5) * 0.15,
          color: COLORS[Math.floor(Math.random() * COLORS.length)],
          alpha: 0.15 + Math.random() * 0.25
        }));
      }

      function handleResize() { resize(); spawn(); }
      window.addEventListener('resize', handleResize);
      resize();
      spawn();

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0) p.x = canvas.width;
          if (p.x > canvas.width) p.x = 0;
          if (p.y < 0) p.y = canvas.height;
          if (p.y > canvas.height) p.y = 0;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.alpha;
          ctx.fill();
        });
        ctx.globalAlpha = 1;
        if (!reduceMotion) requestAnimationFrame(draw);
      }
      draw(); // draws one static frame even under reduced motion, then stops
    })();

    // --- tab title change on blur ---
    (function () {
      const ORIGINAL_TITLE = document.title;
      // CUSTOMIZE: whatever you want the tab to say while it's not in focus
      const AWAY_TITLE = '👋 come back!';

      document.addEventListener('visibilitychange', () => {
        document.title = document.hidden ? AWAY_TITLE : ORIGINAL_TITLE;
      });
    })();
  </script>

</body>
</html>
